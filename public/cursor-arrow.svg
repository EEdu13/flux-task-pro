<!--
  Cursor padrão do Fluxo.

  Neutro de propósito: um SVG carregado por URL não enxerga as variáveis de
  tema, e o app tem seis paletas. Corpo claro com contorno grafite é a
  convenção dos sistemas operacionais justamente porque resolve os dois casos —
  o contorno garante contraste no claro, o corpo garante no escuro.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 34 34">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eae8"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="1" dy="1.6" stdDeviation="1.1" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <path d="M4 2.5
           L4 27
           Q4 29 6 27.5
           L11 22.5
           L15 30.5
           Q16 32 17.7 31
           L19.5 30
           Q21 29 20.2 27.3
           L16.8 20.5
           L23.5 20.5
           Q26 20.5 24.3 18.6
           L6.5 2.4
           Q4 0.6 4 2.5 Z"
        fill="url(#g)" stroke="#1b211e" stroke-width="2" stroke-linejoin="round" filter="url(#sh)"/>
</svg>
